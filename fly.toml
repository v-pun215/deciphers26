# fly.toml — Fly.io configuration for deciphers26

app = "deciphers26"
primary_region = "sin"          # Singapore — closest free region to India

[build]
  # Fly auto-detects Go and builds with 'go build'

[env]
  PORT = "8080"

[[services]]
  protocol   = "tcp"
  internal_port = 8080

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval    = "15s"
    timeout     = "2s"
    grace_period = "5s"

[[mounts]]
  source      = "deciphers26_data"
  destination = "/data"
